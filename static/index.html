<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PDF Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <div class="app">
    <aside class="sidebar glass">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">PDF Chatbot</span>
      </div>

      <button id="new-chat" type="button" class="new-chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>

      <section class="side-section side-chats" aria-labelledby="chats-heading">
        <h2 id="chats-heading" class="side-heading">Chats</h2>
        <ul id="chat-list" class="chat-list"></ul>
      </section>

      <section class="side-section" aria-labelledby="pdfs-heading">
        <h2 id="pdfs-heading" class="side-heading">Files in this chat</h2>
        <ul id="pdf-list" class="pdf-list"></ul>
        <p id="pdf-empty" class="side-note">No files yet.</p>
        <label class="add-pdf" id="add-pdf">
          <input id="file-input" type="file" accept="application/pdf,.pdf" multiple>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
          Add PDF
        </label>
        <p id="upload-status" class="side-note" role="status" hidden></p>
      </section>

      <details class="model" id="model">
        <summary>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span class="model-title">Model</span>
          <span id="model-summary" class="model-summary"></span>
        </summary>
        <form id="settings-form" class="model-form">
          <label class="field">
            <span>Provider</span>
            <select id="provider">
              <option value="openrouter">OpenRouter</option>
              <option value="anthropic">Anthropic</option>
              <option value="gemini">Gemini</option>
            </select>
          </label>
          <label class="field">
            <span>Model</span>
            <select id="model-select">
              <option value="">Loading…</option>
            </select>
          </label>
          <label class="field">
            <span>API key</span>
            <input id="api-key" type="password" autocomplete="off" placeholder="Paste a new key">
          </label>
          <div class="model-row">
            <span id="key-status" class="key-status" role="status">No key yet</span>
            <button type="submit" class="button">Save key</button>
          </div>
        </form>
      </details>
    </aside>

    <main class="main" id="reading">
      <header class="topbar">
        <input id="chat-name" class="chat-name" type="text" maxlength="120" aria-label="Chat name" autocomplete="off">
        <button id="delete-chat" type="button" class="icon-button" aria-label="Delete chat" title="Delete chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>
      </header>

      <div id="server-banner" class="banner" role="alert" hidden>
        The server isn't running. Start it from the project folder with
        <code>venv/bin/uvicorn app:app</code>, then open
        <a href="http://127.0.0.1:8000">127.0.0.1:8000</a>.
      </div>

      <div id="messages" class="thread" aria-live="polite"></div>

      <template id="welcome-template">
        <section id="welcome" class="welcome">
          <div class="orb" aria-hidden="true"></div>
          <h1 class="welcome-title">Chat with your PDFs</h1>
          <p class="welcome-text">Add a document, ask anything about it, and see the exact pages every answer comes from.</p>
          <label class="drop-hint" for="file-input">Drop a PDF here, or <span class="link">choose files</span>.</label>
        </section>
      </template>

      <form id="ask-form" class="composer">
        <label for="question" class="visually-hidden">Your question</label>
        <textarea id="question" rows="1" placeholder="Ask anything about your PDFs…" required></textarea>
        <button id="send" type="submit" class="send" aria-label="Send question">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </form>

      <div class="drop-overlay" aria-hidden="true"><p>Drop to add to this chat</p></div>
    </main>
  </div>

  <div id="excerpt" class="excerpt glass" role="tooltip" hidden>
    <p id="excerpt-where" class="excerpt-where"></p>
    <div id="excerpt-text" class="excerpt-text"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
